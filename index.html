<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="format-detection" content="telephone=no">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23FF6B35'/%3E%3Cpath d='M14 34h36c0 9-8 15-18 15S14 43 14 34z' fill='%23fff'/%3E%3Cpath d='M22 26c0-4 4-4 4-8M32 26c0-4 4-4 4-8M42 26c0-4 3-4 3-7' stroke='%23fff' stroke-width='3' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">
<title>绍兴人家的今日菜单 · 点菜&厨房</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --primary:#FF6B35;
  --primary-light:#FFF0E8;
  --primary-dark:#E55A2B;
  --success:#4CAF50;
  --success-light:#E8F5E9;
  --info:#2B6FD9;
  --info-light:#EAF1FD;
  --warn:#D9930D;
  --warn-light:#FFF7E0;
  --danger:#E05260;
  --danger-light:#FDEBEC;
  --text:#2D2D2D;
  --text-light:#666;
  --text-muted:#999;
  --bg:#F8F8F8;
  --card:#FFFFFF;
  --border:#EEEEEE;
  --shadow:0 2px 12px rgba(0,0,0,.08);
  --radius:14px;
}
html,body{height:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif;
  background:var(--bg);color:var(--text);line-height:1.6;
  max-width:480px;margin:0 auto;min-height:100vh;position:relative;
  box-shadow:0 0 30px rgba(0,0,0,.06);
}
.hidden{display:none!important}
button{font-family:inherit}
a{color:var(--info)}

/* ===== Sticky top ===== */
.sticky-top{position:sticky;top:0;z-index:100}
.header{
  background:linear-gradient(135deg,var(--primary),#FF8F65);
  color:#fff;padding:12px 14px 10px;
  box-shadow:0 2px 16px rgba(255,107,53,.35);
}
.header-top{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.h-title{font-size:18px;font-weight:700;line-height:1.35;display:flex;align-items:center;gap:5px;flex-wrap:wrap}
.h-title .who{
  font-size:12px;font-weight:700;background:rgba(255,255,255,.24);
  padding:2px 9px;border-radius:11px;max-width:150px;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap;
}
.header-sub{font-size:11.5px;opacity:.92;margin-top:2px}
.h-actions{display:flex;gap:6px;flex-shrink:0}
.icon-btn{
  min-width:32px;height:32px;padding:0 8px;border-radius:16px;border:none;cursor:pointer;
  background:rgba(255,255,255,.22);color:#fff;font-size:14px;line-height:1;
  display:flex;align-items:center;justify-content:center;gap:4px;transition:all .2s;
}
.icon-btn:active{transform:scale(.92);background:rgba(255,255,255,.38)}
.mode-switch{display:flex;background:rgba(255,255,255,.22);border-radius:20px;padding:3px;margin-top:9px}
.mode-btn{
  flex:1;border:none;background:transparent;color:#fff;font-size:13.5px;font-weight:600;
  padding:7px 10px;border-radius:17px;cursor:pointer;transition:all .25s;white-space:nowrap;
  display:flex;align-items:center;justify-content:center;gap:5px;
}
.mode-btn.active{background:#fff;color:var(--primary);box-shadow:0 2px 6px rgba(0,0,0,.15)}
.mode-badge{
  min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:rgba(255,255,255,.3);
  font-size:11px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;
}
.mode-btn.active .mode-badge{background:var(--primary);color:#fff}
.mode-btn .mode-badge.alert{background:var(--danger);color:#fff;animation:pulseB 1.4s infinite}
@keyframes pulseB{0%,100%{transform:scale(1)}50%{transform:scale(1.15)}}

/* ===== Tabs ===== */
.tabs{
  display:flex;gap:8px;overflow-x:auto;padding:9px 12px 7px;
  background:var(--card);scrollbar-width:none;
}
.tabs::-webkit-scrollbar{display:none}
.tab{
  flex-shrink:0;border:1px solid var(--border);background:var(--bg);
  color:var(--text-light);font-size:13px;padding:5px 13px;border-radius:16px;
  cursor:pointer;transition:all .2s;font-weight:500;
}
.tab.active{background:var(--primary);border-color:var(--primary);color:#fff;font-weight:600}
.tab .tnum{font-size:10.5px;opacity:.75;margin-left:3px}

/* ===== Search row ===== */
.search-row{
  display:flex;gap:8px;padding:0 12px 9px;background:var(--card);
  border-bottom:1px solid var(--border);align-items:center;
}
.search-box{flex:1;position:relative}
.search-box input{
  width:100%;border:1.5px solid var(--border);border-radius:18px;background:var(--bg);
  padding:7px 30px 7px 12px;font-size:13px;outline:none;transition:border-color .2s;
}
.search-box input:focus{border-color:var(--primary);background:#fff}
.search-clear{
  position:absolute;right:6px;top:50%;transform:translateY(-50%);border:none;background:transparent;
  color:var(--text-muted);font-size:14px;cursor:pointer;padding:2px 6px;display:none;
}
.btn-random{
  flex-shrink:0;border:1.5px solid var(--primary);background:var(--primary-light);color:var(--primary);
  font-size:12.5px;font-weight:600;padding:6px 11px;border-radius:18px;cursor:pointer;
  transition:all .2s;white-space:nowrap;
}
.btn-random:active{background:var(--primary);color:#fff;transform:scale(.95)}

/* ===== Banners ===== */
.banner{
  margin:10px 12px 0;padding:11px 13px;border-radius:12px;font-size:13px;
  animation:fadeUp .3s ease both;position:relative;
}
@keyframes fadeUp{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
.banner-import{background:var(--info-light);border:1px solid #C9DBF7;color:#1E4E9C}
.banner-title{font-weight:700;margin-bottom:6px;display:flex;align-items:center;gap:6px}
.banner-dishes{font-size:12px;color:var(--text-light);margin-bottom:9px;line-height:1.7}
.banner-btns{display:flex;gap:8px}
.banner-btn{
  border:none;border-radius:16px;padding:6px 16px;font-size:12.5px;font-weight:600;cursor:pointer;
}
.banner-btn.ok{background:var(--info);color:#fff}
.banner-btn.no{background:transparent;color:var(--text-muted);border:1px solid var(--border)}
.banner-close{
  position:absolute;top:8px;right:10px;border:none;background:transparent;color:inherit;
  opacity:.5;font-size:14px;cursor:pointer;
}

/* ===== Recent history ===== */
.recent{margin:10px 12px 0;background:#F3F3F3;border-radius:12px;padding:9px 11px}
.recent-title{font-size:12px;color:var(--text-muted);font-weight:600;display:flex;justify-content:space-between;align-items:center;cursor:pointer}
.recent-note{font-size:10.5px;color:#BBB;font-weight:400}
.recent-list{display:flex;flex-wrap:wrap;gap:6px;margin-top:7px}
.recent-chip{
  font-size:11.5px;color:#AAA;background:#EAEAEA;border-radius:12px;padding:3px 10px;
  text-decoration:line-through;text-decoration-color:#CCC;
}
.recent-chip b{color:#999;font-weight:500;text-decoration:none}

/* ===== Dish grid ===== */
.content{padding:10px 12px 96px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cat-title{
  grid-column:1/-1;font-size:13.5px;font-weight:700;color:var(--text);
  padding:6px 2px 0;display:flex;align-items:center;gap:6px;
}
.cat-title .ct-line{flex:1;height:1px;background:var(--border)}
.cat-title .ct-num{font-size:11px;color:var(--text-muted);font-weight:400}
.dish-card{
  background:var(--card);border:2px solid transparent;border-radius:var(--radius);
  box-shadow:var(--shadow);padding:11px 11px 9px;cursor:pointer;position:relative;
  transition:all .18s;animation:fadeUp .25s ease both;user-select:none;
}
.dish-card:active{transform:scale(.97)}
.dish-card.selected{border-color:var(--primary);background:var(--primary-light)}
.dish-card.suggest{border-color:var(--info);box-shadow:0 0 0 3px rgba(43,111,217,.18),var(--shadow);animation:sugPulse 1.2s ease-in-out 3}
@keyframes sugPulse{0%,100%{box-shadow:0 0 0 3px rgba(43,111,217,.18),var(--shadow)}50%{box-shadow:0 0 0 6px rgba(43,111,217,.10),var(--shadow)}}
.dc-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:4px}
.dc-emoji{font-size:26px;line-height:1.2}
.fav-btn{
  border:none;background:transparent;font-size:16px;cursor:pointer;color:#CCC;
  padding:0 2px;line-height:1;transition:transform .15s;
}
.fav-btn.on{color:#FF4D6A}
.fav-btn:active{transform:scale(1.3)}
.dc-name{font-size:14px;font-weight:700;line-height:1.35}
.dc-name .fav-mark{color:#FF4D6A;font-size:11px;margin-left:2px}
.dc-desc{
  font-size:11.5px;color:var(--text-light);margin-top:2px;line-height:1.5;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:34px;
}
.dc-meta{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px;align-items:center}
.dc-meta span{font-size:10px;color:var(--text-muted);background:var(--bg);border-radius:8px;padding:1.5px 7px}
.dc-meta .diff-中等{color:var(--warn);background:var(--warn-light)}
.dc-meta .diff-较难{color:var(--danger);background:var(--danger-light)}
.dc-meta .diff-简单{color:var(--success);background:var(--success-light)}
.dc-recent-tag{font-size:10px;color:#AAA;background:#EFEFEF;border-radius:8px;padding:1.5px 7px}
.dc-foot{display:flex;justify-content:space-between;align-items:center;margin-top:8px}
.dc-detail-btn{
  border:none;background:transparent;color:var(--info);font-size:11.5px;cursor:pointer;padding:2px 0;
}
.dc-check{
  width:22px;height:22px;border-radius:50%;border:2px solid #DDD;background:#fff;
  color:transparent;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;
  transition:all .18s;
}
.dish-card.selected .dc-check{background:var(--primary);border-color:var(--primary);color:#fff}
.dc-recent-badge{
  position:absolute;top:8px;left:8px;font-size:9px;color:#999;background:#F0F0F0;
  border-radius:7px;padding:1px 6px;
}
/* recipe expansion inside card */
.dc-recipe{grid-column:1/-1;display:block}
.recipe-box{
  background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);
  padding:13px;margin-bottom:4px;animation:fadeUp .25s ease both;
}
.rb-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.rb-title{font-size:15px;font-weight:700}
.rb-close{border:none;background:var(--bg);color:var(--text-light);border-radius:12px;font-size:12px;padding:3px 11px;cursor:pointer}
.rb-sec{font-size:12.5px;font-weight:700;color:var(--primary);margin:10px 0 5px}
.rb-ings{display:flex;flex-wrap:wrap;gap:5px}
.rb-ing{font-size:11.5px;background:var(--bg);border-radius:9px;padding:3px 9px;color:var(--text-light)}
.rb-ing b{color:var(--text);font-weight:600}
.rb-step{font-size:12.5px;color:var(--text);margin-bottom:7px;display:flex;gap:7px;line-height:1.65}
.rb-step .st-no{
  flex-shrink:0;width:18px;height:18px;border-radius:50%;background:var(--primary-light);
  color:var(--primary);font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;margin-top:2px;
}
.rb-tip{
  font-size:12px;background:var(--warn-light);color:#8A6208;border-radius:10px;
  padding:8px 11px;margin-top:9px;line-height:1.6;
}
.rb-add-btn{
  width:100%;margin-top:10px;border:none;border-radius:12px;padding:9px;font-size:13.5px;font-weight:700;
  background:var(--primary);color:#fff;cursor:pointer;
}
.rb-add-btn.added{background:var(--success-light);color:var(--success)}

/* ===== Kitchen recipes section (expandable cards) ===== */
.kr-card{
  background:var(--card);border-radius:12px;box-shadow:var(--shadow);
  margin-bottom:9px;overflow:hidden;animation:fadeUp .25s ease both;
}
.kr-head{
  display:flex;align-items:center;gap:10px;padding:12px 14px;cursor:pointer;
  transition:background .2s;user-select:none;
}
.kr-head:active{background:var(--bg)}
.kr-emoji{font-size:24px;flex-shrink:0}
.kr-info{flex:1;min-width:0}
.kr-name{font-size:15px;font-weight:700;color:var(--text)}
.kr-meta{font-size:11.5px;color:var(--text-muted);margin-top:2px;display:flex;gap:8px;flex-wrap:wrap}
.kr-meta .diff-简单{color:var(--success)}
.kr-meta .diff-中等{color:#F57C00}
.kr-meta .diff-较难{color:#E53935}
.kr-for{
  font-size:10.5px;color:var(--primary-dark);background:var(--primary-light);
  padding:2px 8px;border-radius:9px;margin-top:4px;display:inline-block;
}
.kr-arrow{
  color:var(--text-muted);font-size:11px;transition:transform .25s;flex-shrink:0;
}
.kr-card.open .kr-arrow{transform:rotate(180deg)}
.kr-body{
  display:none;padding:0 14px 14px;border-top:1px dashed var(--border);background:#FFFCFA;
}
.kr-card.open .kr-body{display:block;animation:fadeUp .25s ease}
.kr-sec{font-size:12.5px;font-weight:700;color:var(--primary);margin:11px 0 6px}
.kr-ings{display:flex;flex-wrap:wrap;gap:5px}
.kr-ing{font-size:11.5px;background:var(--bg);border-radius:9px;padding:3px 9px;color:var(--text-light)}
.kr-ing b{color:var(--text);font-weight:600}
.kr-step{
  font-size:12.5px;color:var(--text);margin-bottom:8px;display:flex;gap:8px;line-height:1.7;
}
.kr-step .st-no{
  flex-shrink:0;width:20px;height:20px;border-radius:50%;background:var(--primary);
  color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;margin-top:2px;
}
.kr-tip{
  font-size:12px;background:var(--warn-light);color:#8A6208;border-radius:10px;
  padding:9px 12px;margin-top:10px;line-height:1.65;
}
.kr-expand-all{
  display:block;width:100%;margin-bottom:9px;padding:9px;border:1.5px dashed var(--border);
  border-radius:10px;background:transparent;color:var(--text-light);font-size:12.5px;
  cursor:pointer;font-weight:600;
}
.kr-expand-all:active{background:var(--bg)}

/* ===== Empty state ===== */
.empty{text-align:center;padding:50px 20px;color:var(--text-muted)}
.empty .e-emoji{font-size:44px;margin-bottom:10px}
.empty p{font-size:13px}

/* ===== Bottom bar ===== */
.bottom-bar{
  position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;
  background:var(--card);border-top:1px solid var(--border);padding:9px 14px calc(9px + env(safe-area-inset-bottom));
  display:flex;align-items:center;gap:10px;z-index:200;box-shadow:0 -2px 14px rgba(0,0,0,.06);
}
.bb-info{flex:1;font-size:13px;color:var(--text-light)}
.bb-info b{color:var(--primary);font-size:17px}
.bb-info.submitted b{color:var(--success)}
.btn-submit{
  border:none;background:var(--primary);color:#fff;font-size:14.5px;font-weight:700;
  padding:11px 26px;border-radius:24px;cursor:pointer;transition:all .2s;
  box-shadow:0 3px 10px rgba(255,107,53,.4);
}
.btn-submit:disabled{background:#DDD;box-shadow:none;color:#fff;cursor:not-allowed}
.btn-submit:not(:disabled):active{transform:scale(.95)}
.btn-mini{
  border:1.5px solid var(--primary);background:#fff;color:var(--primary);font-size:12px;font-weight:600;
  padding:7px 10px;border-radius:18px;cursor:pointer;white-space:nowrap;
}
.btn-mini:active{background:var(--primary-light);transform:scale(.95)}

/* ===== Toast ===== */
.toast{
  position:fixed;bottom:90px;left:50%;transform:translateX(-50%) translateY(10px);
  background:rgba(40,40,40,.92);color:#fff;font-size:13.5px;padding:10px 20px;border-radius:22px;
  z-index:999;opacity:0;pointer-events:none;transition:all .25s;white-space:nowrap;max-width:88%;
  overflow:hidden;text-overflow:ellipsis;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* ===== Kitchen ===== */
.k-content{padding:10px 12px 40px}
.k-sec-title{
  font-size:15px;font-weight:700;margin:14px 2px 9px;display:flex;align-items:center;gap:7px;
}
.k-sec-title .ks-num{font-size:11.5px;color:#fff;background:var(--primary);border-radius:10px;padding:1px 8px;font-weight:600}
.person-card{
  background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);
  padding:12px;margin-bottom:10px;animation:fadeUp .25s ease both;
}
.pc-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.pc-name{font-size:14.5px;font-weight:700;display:flex;align-items:center;gap:6px}
.pc-name .pc-avatar{
  width:26px;height:26px;border-radius:50%;background:var(--primary-light);color:var(--primary);
  font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center;
}
.pc-count{font-size:11.5px;color:var(--text-muted)}
.pc-del{border:none;background:transparent;color:#CCC;font-size:12px;cursor:pointer;padding:2px 6px}
.pc-dishes{display:flex;flex-wrap:wrap;gap:6px}
.pc-dish{
  font-size:12px;background:var(--bg);border-radius:10px;padding:4px 10px;color:var(--text);
  cursor:pointer;border:1px solid transparent;
}
.pc-dish:active{border-color:var(--primary)}
.k-empty{
  background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);
  text-align:center;padding:44px 20px;color:var(--text-muted);
}
.k-empty .ke-emoji{font-size:44px;margin-bottom:10px}
.k-empty p{font-size:13px;margin-bottom:4px}
/* shopping list */
.shop-card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:12px;margin-bottom:10px}
.shop-cat{
  font-size:12.5px;font-weight:700;color:var(--primary);margin:10px 0 6px;
  display:flex;align-items:center;gap:6px;
}
.shop-cat:first-child{margin-top:2px}
.shop-cat .sc-emoji{font-size:14px}
.shop-item{
  display:flex;align-items:center;gap:8px;padding:6px 2px;border-bottom:1px dashed var(--border);
}
.shop-item:last-child{border-bottom:none}
.si-check{
  flex-shrink:0;width:19px;height:19px;border-radius:5px;border:1.5px solid #CCC;background:#fff;
  cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:11px;color:transparent;font-weight:700;
}
.si-check.on{background:var(--success);border-color:var(--success);color:#fff}
.si-info{flex:1;min-width:0}
.si-name{font-size:13px;font-weight:600}
.si-name.done{text-decoration:line-through;color:var(--text-muted)}
.si-amt{font-size:11px;color:var(--text-muted);margin-top:1px;line-height:1.5;word-break:break-all}
.si-links{display:flex;gap:5px;flex-shrink:0}
.buy-link{
  font-size:10.5px;text-decoration:none;border-radius:9px;padding:3px 8px;font-weight:600;
}
.buy-link.hema{background:#E7F4FF;color:#0074E0}
.buy-link.dd{background:#EAF7EC;color:#2FA84F}
.shop-divider{
  display:flex;align-items:center;gap:8px;margin:14px 0 8px;color:var(--text-muted);font-size:11px;
}
.shop-divider::before,.shop-divider::after{content:'';flex:1;height:1px;background:var(--border)}
.k-actions{display:flex;flex-direction:column;gap:9px;margin-top:16px}
.btn-k{
  border:none;border-radius:14px;padding:12px;font-size:14px;font-weight:700;cursor:pointer;transition:all .15s;
}
.btn-k:active{transform:scale(.97)}
.btn-k.orange{background:var(--primary);color:#fff;box-shadow:0 3px 10px rgba(255,107,53,.35)}
.btn-k.ghost{background:var(--card);color:var(--text);border:1.5px solid var(--border);box-shadow:var(--shadow)}
.btn-k.green{background:var(--success);color:#fff;box-shadow:0 3px 10px rgba(76,175,80,.3)}
.k-row{display:flex;gap:9px}
.k-row .btn-k{flex:1}

/* ===== Name modal ===== */
.modal-mask{
  position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:500;
  display:flex;align-items:center;justify-content:center;padding:24px;
}
.modal{
  background:#fff;border-radius:18px;padding:22px 20px;width:100%;max-width:320px;
  animation:fadeUp .3s ease both;text-align:center;
}
.modal .m-emoji{font-size:40px;margin-bottom:8px}
.modal h3{font-size:16.5px;margin-bottom:6px}
.modal p{font-size:12.5px;color:var(--text-light);margin-bottom:14px;line-height:1.6}
.modal input{
  width:100%;border:1.5px solid var(--border);border-radius:12px;padding:10px 12px;
  font-size:15px;text-align:center;outline:none;margin-bottom:8px;
}

.modal .m-quick button{
  border:1px solid var(--border);background:var(--bg);border-radius:14px;padding:4px 13px;
  font-size:12.5px;color:var(--text-light);cursor:pointer;
}

.btn-modal{
  width:100%;border:none;background:var(--primary);color:#fff;font-size:15px;font-weight:700;
  padding:11px;border-radius:24px;cursor:pointer;box-shadow:0 3px 10px rgba(255,107,53,.4);
}
.btn-modal:active{transform:scale(.97)}

/* recipe modal in kitchen */
.rb-modal-wrap{max-height:74vh;overflow-y:auto;width:100%;max-width:400px}
.rb-modal-wrap .recipe-box{box-shadow:none;margin:0}
