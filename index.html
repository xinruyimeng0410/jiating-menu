       +'<span class="si-check'+(on?' on':'')+'" data-buy="'+esc(key)+'">✓</span>'
       +'<div class="si-info"><div class="si-name'+(on?' done':'')+'">'+esc(it.name)+'</div>'
       +'<div class="si-amt">'+esc(it.amts.join(' / '))+(it.src.length?' · '+esc(it.src.join('、')):'')+'</div></div>'
       +'<div class="si-links"><a class="buy-link hema" href="'+hema+'" target="_blank" rel="noopener">盒马</a><a class="buy-link dd" href="'+dd+'" target="_blank" rel="noopener">叮咚</a></div>'
       +'</div>';
      first=false;
    });
  });
  sh+='</div>';
  shopEl.innerHTML=sh;
  /* 做法详情（可折叠卡片） */
  const whoMap={};
  names.forEach(n=>(S.orders[n]||[]).forEach(id=>{
    if(!whoMap[id])whoMap[id]=[];
    if(whoMap[id].indexOf(n)===-1)whoMap[id].push(n);
  }));
  const orderedIds=[...allOrderedIds()];
  let rh='<div class="k-sec-title">📖 做法详情<span class="ks-num">共 '+orderedIds.length+' 道 · 点击菜名展开</span></div>';
  rh+='<button class="kr-expand-all" id="btnExpandAll">🔽 全部展开 / 收起</button>';
  orderedIds.forEach(id=>{
    const d=BY_ID[id];if(!d)return;
    const forWhom=(whoMap[id]||[]).join('、');
    rh+='<div class="kr-card" data-krid="'+id+'">'
     +'<div class="kr-head" data-krhead="'+id+'">'
       +'<span class="kr-emoji">'+d.emoji+'</span>'
       +'<div class="kr-info">'
         +'<div class="kr-name">'+esc(d.name)+'</div>'
         +'<div class="kr-meta"><span>'+CAT_EMOJI[d.cat]+esc(d.cat)+'</span><span>⏱'+esc(d.time)+'</span><span class="diff-'+d.diff+'">'+esc(d.diff)+'</span></div>'
         +(forWhom?'<span class="kr-for">为 '+esc(forWhom)+' 做</span>':'')
       +'</div>'
       +'<span class="kr-arrow">▼</span>'
     +'</div>'
     +'<div class="kr-body">'
       +'<div class="kr-sec">🧺 食材清单</div>'
       +'<div class="kr-ings">'+d.ing.map(i=>'<span class="kr-ing"><b>'+esc(i[0])+'</b> '+esc(i[1])+'</span>').join('')+'</div>'
       +'<div class="kr-sec">👨‍🍳 做法步骤</div>'
       +d.steps.map((s,i)=>'<div class="kr-step"><span class="st-no">'+(i+1)+'</span><span>'+esc(s)+'</span></div>').join('')
       +(d.tip?'<div class="kr-tip">💡 '+esc(d.tip)+'</div>':'')
     +'</div>'
    +'</div>';
  });
  recEl.innerHTML=rh;
}
function buildShopping(){
  const ids=allOrderedIds();
  const map={};
  ids.forEach(id=>{
    const d=BY_ID[id];if(!d)return;
    d.ing.forEach(arr=>{
      const name=arr[0],amt=arr[1],cat=arr[2];
      const key=name+'|'+cat;
      if(!map[key])map[key]={name:name,cat:cat,amts:[],src:[]};
      if(amt&&map[key].amts.indexOf(amt)===-1)map[key].amts.push(amt);
      if(map[key].src.indexOf(d.name)===-1)map[key].src.push(d.name);
    });
  });
  const groups={};
  SHOP_CATS.forEach(c=>groups[c]=[]);
  Object.keys(map).forEach(k=>{
    const it=map[k];
    if(groups[it.cat])groups[it.cat].push(it);
    else groups['调料'].push(it);
  });
  return groups;
}
function shopText(){
  const groups=buildShopping();
  let lines=['【今日采购清单 '+dateCN(todayStr())+'】'];
  SHOP_CATS.forEach(cat=>{
    const items=groups[cat];
    if(!items||!items.length)return;
    if(cat==='调料')lines.push('————————————————','以下调料家中常备，按需补充：');
    lines.push(SHOP_EMOJI[cat]+' '+cat+'：');
    items.forEach(it=>lines.push('· '+it.name+(it.amts.length?'（'+it.amts.join(' / ')+'）':'')+' ← '+it.src.join('、')));
    lines.push('');
  });
  return lines.join('\n').trim();
}
function orderText(){
  const names=Object.keys(S.orders).filter(n=>(S.orders[n]||[]).length);
  let lines=['【今日点菜单 '+dateCN(todayStr())+'】',''];
  names.forEach(n=>{
    lines.push('👤 '+n+'（'+S.orders[n].length+'道）：'+S.orders[n].map(id=>BY_ID[id]?BY_ID[id].name:'?').join('、'));
  });
  lines.push('','———————— 做法明细 ————————','');
  const seen=new Set();
  names.forEach(n=>S.orders[n].forEach(id=>{
    if(seen.has(id))return;seen.add(id);
    const d=BY_ID[id];if(!d)return;
    lines.push(d.emoji+' '+d.name+'（'+d.time+' / '+d.diff+'）');
    lines.push('食材：'+d.ing.map(i=>i[0]+' '+i[1]).join('；'));
    d.steps.forEach((s,i)=>lines.push((i+1)+'. '+s));
    lines.push('💡 '+d.tip,'');
  }));
  lines.push(shopText());
  return lines.join('\n');
}
function newDay(){
  S.orders={};S.submits={};
  selected.clear();submitted=false;bought.clear();
  saveState();
  renderKitchen();renderOrderView();
  showToast('🌅 新的一天，等家人重新点菜');
}

/* ---------- 模式切换 ---------- */
function setMode(m){
  mode=m;
  $('btnModeOrder').classList.toggle('active',m==='order');
  $('btnModeKitchen').classList.toggle('active',m==='kitchen');
  $('orderView').classList.toggle('hidden',m!=='order');
  $('orderSticky').classList.toggle('hidden',m!=='order');
  $('kitchenView').classList.toggle('hidden',m!=='kitchen');
  $('bottomBar').classList.toggle('hidden',m!=='order');
  $('bannerArea').classList.toggle('hidden',m!=='order');
  document.body.style.paddingBottom='0';
  if(m==='kitchen')renderKitchen();
  window.scrollTo(0,0);
}

/* ---------- 身份 ---------- */
function openNameModal(prefill){
  $('nameInput').value=prefill||S.name||'';
  $('nameModal').classList.remove('hidden');
  setTimeout(()=>$('nameInput').focus(),120);
}
function saveName(){
  const v=$('nameInput').value.trim().slice(0,10);
  if(!v){showToast('请输入名字');return;}
  S.name=v;saveState();
  $('nameModal').classList.add('hidden');
  selected=new Set(myOrders());
  submitted=(S.submits[S.name]===todayStr());
  renderOrderView();
  showToast('你好，'+v+'！开始点菜吧 🍽️');
}
function initQuickNames(){
  const quick=['爸爸','妈妈','爷爷','奶奶','哥哥','姐姐'];
  $('nameQuick').innerHTML=quick.map(q=>'<button data-qn="'+q+'">'+q+'</button>').join('');
}

/* ---------- 分享链接导入 ---------- */
function parseImport(){
  try{
    const p=new URLSearchParams(location.search);
    const d=p.get('d'),n=p.get('n');
    if(!d||!n)return;
    const ids=d.split(',').map(Number).filter(id=>BY_ID[id]);
    const name=decodeURIComponent(n).slice(0,10);
    if(!ids.length||!name)return;
    if(name===S.name){clearParams();return;}
    const banner=document.createElement('div');
    banner.className='banner banner-import';
    banner.innerHTML='<button class="banner-close" data-bclose="1">✕</button>'
     +'<div class="banner-title">📩 '+esc(name)+' 点了 '+ids.length+' 道菜</div>'
     +'<div class="banner-dishes">'+ids.map(id=>BY_ID[id].emoji+' '+esc(BY_ID[id].name)).join('　')+'</div>'
     +'<div class="banner-btns"><button class="banner-btn ok" data-bimport="1">导入到厨房订单</button><button class="banner-btn no" data-bclose="1">暂不</button></div>';
    $('bannerArea').appendChild(banner);
    banner.addEventListener('click',function(e){
      if(e.target.closest('[data-bimport]')){
        const cur=new Set(S.orders[name]||[]);
        ids.forEach(id=>cur.add(id));
        S.orders[name]=[...cur];
        S.orderDate=todayStr();
        const h=new Set(S.history[todayStr()]||[]);ids.forEach(id=>h.add(id));
        S.history[todayStr()]=[...h];
        saveState();
        banner.remove();clearParams();
        renderKitchenBadge();renderHeader();renderRecent();
        showToast('已导入 '+name+' 的订单，点「厨房」查看 ✓',2500);
      }else if(e.target.closest('[data-bclose]')){
        banner.remove();clearParams();
      }
    });
  }catch(e){}
}
function clearParams(){
  try{history.replaceState(null,'',location.origin+location.pathname);}catch(e){}
}

/* ---------- 事件绑定 ---------- */
function bindEvents(){
  /* 分类 tabs */
  $('tabs').addEventListener('click',function(e){
    const t=e.target.closest('.tab');if(!t)return;
    curCat=t.getAttribute('data-cat');
    suggestIds=null;
    renderTabs();renderGrid();
  });
  /* 搜索 */
  $('searchInput').addEventListener('input',function(){
    searchKw=this.value.trim();
    $('searchClear').style.display=searchKw?'block':'none';
    suggestIds=null;
    renderGrid();
  });
  $('searchClear').addEventListener('click',function(){
    $('searchInput').value='';searchKw='';this.style.display='none';renderGrid();
  });
  /* 随机推荐 */
  $('btnRandom').addEventListener('click',randomSuggest);
  /* 菜品网格：收藏 / 做法 / 选中 */
  $('dishGrid').addEventListener('click',function(e){
    const fav=e.target.closest('[data-fav]');
    if(fav){e.stopPropagation();toggleFav(Number(fav.getAttribute('data-fav')));return;}
    const det=e.target.closest('[data-detail]');
    if(det){e.stopPropagation();openRecipe(Number(det.getAttribute('data-detail')));return;}
    const card=e.target.closest('.dish-card');
    if(card){
      suggestIds=null;
      toggleSelect(Number(card.getAttribute('data-id')));
      renderGrid();
    }
  });
  /* 底部栏 */
  $('bbBtns').addEventListener('click',function(e){
    const b=e.target.closest('[data-act]');if(!b)return;
    const act=b.getAttribute('data-act');
    if(act==='submit')submitOrder();
    else if(act==='share')shareLink();
    else if(act==='copytext')copyMyOrderText();
    else if(act==='continue')continueOrder();
  });
  /* 模式切换 */
  $('btnModeOrder').addEventListener('click',()=>setMode('order'));
  $('btnModeKitchen').addEventListener('click',()=>setMode('kitchen'));
  /* 身份 */
  $('btnEditName').addEventListener('click',()=>openNameModal());
  $('btnNameOk').addEventListener('click',saveName);
  $('nameInput').addEventListener('keydown',e=>{if(e.key==='Enter')saveName();});
  $('nameQuick').addEventListener('click',function(e){
    const b=e.target.closest('[data-qn]');if(!b)return;
    $('nameInput').value=b.getAttribute('data-qn');
  });
  /* 菜谱弹窗 */
  $('recipeModal').addEventListener('click',function(e){
    if(e.target===this||e.target.closest('[data-close]')){closeRecipe();return;}
    const add=e.target.closest('[data-add]');
    if(add){toggleSelect(Number(add.getAttribute('data-add')));renderGrid();renderBottomBar();}
  });
  /* 厨房：菜名看做法 / 删除某人订单 */
  $('kitchenOrders').addEventListener('click',function(e){
    const dish=e.target.closest('[data-kdish]');
    if(dish){openRecipe(Number(dish.getAttribute('data-kdish')));return;}
    const del=e.target.closest('[data-delperson]');
    if(del){
      const n=del.getAttribute('data-delperson');
      delete S.orders[n];delete S.submits[n];
      if(S.name===n){selected.clear();submitted=false;}
      saveState();renderKitchen();renderOrderView();
      showToast('已删除 '+n+' 的订单');
    }
  });
  /* 厨房：做法详情卡片展开/收起 */
  $('kitchenRecipes').addEventListener('click',function(e){
    const expandAll=e.target.closest('#btnExpandAll');
    if(expandAll){
      const cards=this.querySelectorAll('.kr-card');
      const anyClosed=[...cards].some(c=>!c.classList.contains('open'));
      cards.forEach(c=>c.classList.toggle('open',anyClosed));
      expandAll.textContent=anyClosed?'🔼 全部收起':'🔽 全部展开';
      return;
    }
    const head=e.target.closest('[data-krhead]');
    if(head){
      const card=head.closest('.kr-card');
      if(card)card.classList.toggle('open');
    }
  });
  /* 厨房：采购勾选 */
  $('kitchenShopping').addEventListener('click',function(e){
    const c=e.target.closest('[data-buy]');if(!c)return;
    const key=c.getAttribute('data-buy');
    if(bought.has(key))bought.delete(key);else bought.add(key);
    c.classList.toggle('on',bought.has(key));
    const nm=c.parentElement.querySelector('.si-name');
    if(nm)nm.classList.toggle('done',bought.has(key));
  });
  /* 厨房按钮 */
  $('btnCopyShop').addEventListener('click',()=>{
    if(!allOrderedIds().size){showToast('还没有订单');return;}
    copyText(shopText(),'采购清单');
  });
  $('btnCopyOrder').addEventListener('click',()=>{
    if(!allOrderedIds().size){showToast('还没有订单');return;}
    copyText(orderText(),'完整订单');
  });
  $('btnNewDay').addEventListener('click',newDay);
}

/* ---------- 启动 ---------- */
function init(){
  initQuickNames();
  bindEvents();
  selected=new Set(S.name?myOrders():[]);
  submitted=!!(S.name&&S.submits[S.name]===todayStr());
  renderOrderView();
  parseImport();
  if(!S.name){openNameModal();}
}
init();
</script>
